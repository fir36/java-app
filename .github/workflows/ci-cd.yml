name: CI/CD Pipeline

# This pipeline is intentionally a "playground": the SAST tool and the
# deploy target are both switches, not hard-coded choices, so a DevSecOps
# consultant can A/B different tools/targets without editing this file.
#
# Switches (workflow_dispatch input -> repo Variable fallback -> default):
#   sast_tool:      semgrep | sonarqube | fortify | all   (default: semgrep)
#   deploy_target:  ec2-basic | kubernetes-helm | none    (default: ec2-basic)
#   fail_on_sast_findings: 'true' | 'false'               (default: 'false')
#
# Repo Variables (Settings > Actions > Variables) let you change the
# defaults used on ordinary push/PR runs without touching this file:
#   DEFAULT_SAST_TOOL, DEFAULT_DEPLOY_TARGET, DEFAULT_FAIL_ON_SAST
#
# All jobs run on the self-hosted runner. Tool logic lives in standalone
# scripts, not inline in this file, so the pipeline itself stays a thin
# switchboard:
#   scripts/security/sast/<tool>.sh          semgrep.sh, sonar.sh
#   scripts/security/image-scan/<tool>.sh    trivy.sh
#   scripts/deploy/<target>/deploy.sh        ec2-basic/, kubernetes-helm/
# To add a tool/target, drop a new script in the matching folder and point
# a step at it - no need to touch the rest of the workflow.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      sast_tool:
        description: 'SAST tool to run'
        type: choice
        options: [ semgrep, sonarqube, fortify, all ]
        default: semgrep
      deploy_target:
        description: 'Where to deploy after a successful scan'
        type: choice
        options: [ ec2-basic, kubernetes-helm, none ]
        default: ec2-basic
      fail_on_sast_findings:
        description: 'Fail the pipeline if the SAST tool reports findings'
        type: choice
        options: [ 'false', 'true' ]
        default: 'false'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '21'
  SAST_TOOL: ${{ github.event.inputs.sast_tool || vars.DEFAULT_SAST_TOOL || 'semgrep' }}
  DEPLOY_TARGET: ${{ github.event.inputs.deploy_target || vars.DEFAULT_DEPLOY_TARGET || 'ec2-basic' }}
  FAIL_ON_SAST_FINDINGS: ${{ github.event.inputs.fail_on_sast_findings || vars.DEFAULT_FAIL_ON_SAST || 'false' }}
  SAST_SCRIPT_DIR: scripts/security/sast
  IMAGE_SCAN_SCRIPT_DIR: scripts/security/image-scan
  DEPLOY_SCRIPT_DIR: scripts/deploy

# Least-privilege default; individual jobs elevate only what they need.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 1) BUILD STAGE - compile, unit test, package
  # -------------------------------------------------------------------------
  build-and-test:
    name: Build & Unit Test
    runs-on: self-hosted
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit tests
        run: mvn -B clean test

      - name: Package application (skip re-running tests)
        run: mvn -B package -DskipTests

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: account-service-jar
          path: target/account-service.jar
          retention-days: 5

  # -------------------------------------------------------------------------
  # 2) SAST SCAN - swappable tool, selected via env.SAST_TOOL
  #
  #    semgrep    - free, no license, runs out of the box (default)
  #    sonarqube  - needs SONAR_TOKEN + SONAR_HOST_URL secrets (self-hosted
  #                 SonarQube server or SonarCloud)
  #    fortify    - needs FORTIFY_SSC_URL, FORTIFY_SSC_TOKEN, FORTIFY_LICENSE
  #                 organization secrets (Fortify Static Code Analyzer)
  #    all        - runs every tool above so results can be compared
  #                 side-by-side in the Security tab (one SARIF category each)
  #
  #    By default findings are reported but do NOT fail the pipeline; set
  #    fail_on_sast_findings=true (input or DEFAULT_FAIL_ON_SAST variable)
  #    to make any tool's findings a hard gate.
  # -------------------------------------------------------------------------
  sast-scan:
    name: SAST Scan (${{ github.event.inputs.sast_tool || vars.DEFAULT_SAST_TOOL || 'semgrep' }})
    runs-on: self-hosted
    needs: build-and-test
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # Needed so SonarQube can analyze bytecode + coverage; harmless for
      # the other tools.
      - name: Build for analysis (tests + coverage report)
        run: mvn -B clean verify

      # --- Semgrep --- (logic lives in scripts/security/sast/semgrep.sh)
      - name: Run Semgrep scan
        id: semgrep
        if: contains(fromJSON('["semgrep","all"]'), env.SAST_TOOL)
        continue-on-error: ${{ env.FAIL_ON_SAST_FINDINGS != 'true' }}
        run: bash "${{ env.SAST_SCRIPT_DIR }}/semgrep.sh"

      - name: Upload Semgrep SARIF report
        if: contains(fromJSON('["semgrep","all"]'), env.SAST_TOOL) && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      # --- SonarQube --- (logic lives in scripts/security/sast/sonar.sh)
      # Requires: SONAR_TOKEN, SONAR_HOST_URL (repo or org secrets)
      - name: SonarQube scan
        id: sonarqube
        if: contains(fromJSON('["sonarqube","all"]'), env.SAST_TOOL)
        continue-on-error: ${{ env.FAIL_ON_SAST_FINDINGS != 'true' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: bash "${{ env.SAST_SCRIPT_DIR }}/sonar.sh"

      # --- Fortify Static Code Analyzer ---
      # Requires organization secrets: FORTIFY_SSC_URL, FORTIFY_SSC_TOKEN,
      # FORTIFY_LICENSE (base64-encoded fortify.license). Placeholder until
      # a real Fortify entitlement is wired up.
      - name: Fortify Static Code Analyzer scan
        id: fortify
        if: contains(fromJSON('["fortify","all"]'), env.SAST_TOOL)
        continue-on-error: ${{ env.FAIL_ON_SAST_FINDINGS != 'true' }}
        uses: fortify/github-action/sast-scan@v1
        with:
          sast-scan-args: -b account-service -bt mvn -bf pom.xml
        env:
          FORTIFY_SSC_URL: ${{ secrets.FORTIFY_SSC_URL }}
          FORTIFY_TOKEN: ${{ secrets.FORTIFY_SSC_TOKEN }}
          FORTIFY_LICENSE: ${{ secrets.FORTIFY_LICENSE }}

      - name: Import Fortify results into GitHub Security tab
        if: contains(fromJSON('["fortify","all"]'), env.SAST_TOOL) && always()
        uses: fortify/github-action/fpr-import@v1
        with:
          file: gh-scan-output.fpr
        env:
          FORTIFY_SSC_URL: ${{ secrets.FORTIFY_SSC_URL }}
          FORTIFY_TOKEN: ${{ secrets.FORTIFY_SSC_TOKEN }}

  # -------------------------------------------------------------------------
  # 3) REGISTRY LOGIN + DOCKER BUILD + TRIVY CONTAINER SCAN + PUBLISH
  # -------------------------------------------------------------------------
  docker-build-scan-push:
    name: Container Build, Scan & Publish
    runs-on: self-hosted
    needs: [ build-and-test, sast-scan ]
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      image_name: ${{ steps.image.outputs.name }}
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Registry Login (GHCR) ---
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name to lowercase
        id: image
        run: |
          IMAGE_NAME_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${{ env.REGISTRY }}/${IMAGE_NAME_LC}" >> "$GITHUB_OUTPUT"

      # --- Docker Build & Local Artifact ---
      - name: Build local image tag
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Vulnerability Container Scan (report first, always uploaded) ---
      # Logic lives in scripts/security/image-scan/trivy.sh
      - name: Trivy scan - generate SARIF report
        env:
          TRIVY_FORMAT: sarif
          TRIVY_OUTPUT: trivy-results.sarif
          TRIVY_SEVERITY: HIGH,CRITICAL
          TRIVY_EXIT_CODE: '0'
        run: bash "${{ env.IMAGE_SCAN_SCRIPT_DIR }}/trivy.sh" "${{ steps.image.outputs.name }}:${{ github.sha }}"

      - name: Upload Trivy SARIF report to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container-scan

      # --- Vulnerability Gate: fail the pipeline on HIGH/CRITICAL findings ---
      - name: Trivy scan - enforce HIGH/CRITICAL gate
        env:
          TRIVY_FORMAT: table
          TRIVY_OUTPUT: ''
          TRIVY_SEVERITY: HIGH,CRITICAL
          TRIVY_EXIT_CODE: '1'
          TRIVY_IGNORE_UNFIXED: 'true'
        run: bash "${{ env.IMAGE_SCAN_SCRIPT_DIR }}/trivy.sh" "${{ steps.image.outputs.name }}:${{ github.sha }}"

      # --- Publish (only verified images from main are pushed) ---
      - name: Push verified image to GHCR with SHA tag
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # 4a) DEPLOY - basic, single-box EC2 deploy
  #
  #     Runs directly on the self-hosted runner you install on your EC2
  #     instance (no SSH keys needed - the runner *is* the box).
  #
  #     NOTE: job-level `if:` conditions cannot read the `env:` context
  #     (env is only resolved within steps), so the deploy-target switch is
  #     re-evaluated here using the same input -> variable -> default
  #     fallback chain used to build env.DEPLOY_TARGET above.
  # -------------------------------------------------------------------------
  deploy-ec2-basic:
    name: Deploy (EC2 basic docker)
    runs-on: self-hosted
    needs: docker-build-scan-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event.inputs.deploy_target || vars.DEFAULT_DEPLOY_TARGET || 'ec2-basic') == 'ec2-basic'
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Logic lives in scripts/deploy/ec2-basic/deploy.sh
      - name: Deploy to EC2
        run: bash "${{ env.DEPLOY_SCRIPT_DIR }}/ec2-basic/deploy.sh" "${{ needs.docker-build-scan-push.outputs.image_name }}" "${{ needs.docker-build-scan-push.outputs.image_tag }}"

  # -------------------------------------------------------------------------
  # 4b) DEPLOY - Kubernetes via Helm chart (charts/account-service)
  #
  #     Requires a base64-encoded kubeconfig stored as KUBE_CONFIG_BASE64 in
  #     the "production" GitHub Environment. Generate with:
  #       cat ~/.kube/config | base64 -w0
  #
  #     NOTE: see the comment on deploy-ec2-basic above re: env not being
  #     available in job-level `if:` conditions.
  # -------------------------------------------------------------------------
  deploy-kubernetes-helm:
    name: Deploy (Kubernetes / Helm)
    runs-on: self-hosted
    needs: docker-build-scan-push
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event.inputs.deploy_target || vars.DEFAULT_DEPLOY_TARGET || 'ec2-basic') == 'kubernetes-helm'
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.15.0'

      - name: Configure kubeconfig from secret
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_BASE64 }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Logic lives in scripts/deploy/kubernetes-helm/deploy.sh
      - name: Deploy via Helm
        run: bash "${{ env.DEPLOY_SCRIPT_DIR }}/kubernetes-helm/deploy.sh" "${{ needs.docker-build-scan-push.outputs.image_name }}" "${{ needs.docker-build-scan-push.outputs.image_tag }}"

      - name: Remove kubeconfig
        if: always()
        run: rm -f "$HOME/.kube/config"
